<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>微博碎句 · 第二版设计稿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/wenkai-weibo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 母题：一只纸飞机。全页所有纸飞机都 <use> 这一个 symbol -->
  <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="plane" viewBox="0 0 24 24">
      <path d="M2.2 11.6 L21.8 3.2 L15.6 20.6 L11.2 13.4 Z M11.2 13.4 L21.8 3.2 M11.2 13.4 L10.4 18.6 L13.2 15.9"
            fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="progress" data-motif="progress" aria-hidden="true">
    <span class="progress-line" data-progress-line></span>
    <svg class="progress-plane" data-progress-plane viewBox="0 0 24 24"><use href="#plane"/></svg>
  </div>

  <header class="masthead">
    <svg class="hero" data-motif="hero" viewBox="0 0 300 96" aria-hidden="true">
      <path class="hero-trail" d="M8 84 C 60 84, 70 30, 118 34 C 160 38, 150 78, 124 72 C 100 66, 126 22, 182 26 C 222 29, 246 46, 270 30"/>
      <g class="hero-plane"><use href="#plane" x="262" y="12" width="28" height="28"/></g>
    </svg>
    <h1 class="title">微博碎句</h1>
    <nav class="toc" aria-label="目录" data-toc hidden></nav>
  </header>

  <aside class="music" data-music data-state="idle" aria-label="背景音乐">
    <div class="music-stage">
      <div class="music-player" data-music-player></div>
    </div>
    <div class="music-meta">
      <button class="music-toggle" type="button" data-music-toggle aria-pressed="false" aria-label="播放 I Love You So">
        <svg data-motif="music" viewBox="0 0 24 24" aria-hidden="true"><use href="#plane"/></svg>
      </button>
      <p class="music-title">I Love You So<span> · The Walters</span></p>
      <p class="music-status" data-music-status aria-live="polite">轻触页面任意处开始</p>
      <div class="music-offline" data-music-offline hidden>
        <ul>
          <li><a href="https://music.163.com/#/search/m/?s=I%20Love%20You%20So%20The%20Walters" target="_blank" rel="noopener">网易云音乐</a></li>
          <li><a href="https://music.apple.com/search?term=The%20Walters%20I%20Love%20You%20So" target="_blank" rel="noopener">Apple Music</a></li>
          <li><a href="https://open.spotify.com/search/The%20Walters%20I%20Love%20You%20So" target="_blank" rel="noopener">Spotify</a></li>
          <li><a href="https://www.youtube.com/results?search_query=The+Walters+I+Love+You+So" target="_blank" rel="noopener">YouTube</a></li>
        </ul>
      </div>
    </div>
  </aside>

  <main class="page" id="weibo" tabindex="-1">
    <article class="weibo" data-weibo-body aria-busy="true">
      <p class="weibo-loading">正在翻开……</p>
    </article>
  </main>

  <footer class="end" aria-hidden="true">
    <svg class="end-plane" data-motif="end" viewBox="0 0 120 40">
      <path class="end-trail" d="M4 10 C 30 10, 40 34, 72 32"/>
      <use href="#plane" x="74" y="20" width="22" height="22"/>
    </svg>
  </footer>

  <button class="to-top" type="button" data-motif="top" data-to-top aria-label="回到顶部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#plane"/></svg>
  </button>

  <script src="../../vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
