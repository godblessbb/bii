<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-label="一颗小星球上长着三棵胖乎乎的猴面包树">
  <!-- 原创手绘感插画：datode.com 微博存档设计稿。 -->
  <style>
    .ink{fill:none;stroke:#3a3029;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1.4}
    .wash-planet{fill:#a9c3a0;opacity:.6}
    .wash-trunk{fill:#b58a63;opacity:.7}
    .wash-crown{fill:#6f9a62;opacity:.65}
    .wash-sky{fill:#c9b6d9;opacity:.35}
    .star{fill:#e2ab3c}
    @media (prefers-color-scheme: dark){
      .ink{stroke:#efe4cc}
      .wash-planet{fill:#5f8a6a;opacity:.55}
      .wash-trunk{fill:#9a7350;opacity:.7}
      .wash-crown{fill:#77a868;opacity:.55}
      .wash-sky{fill:#4b3f72;opacity:.45}
      .star{fill:#ffd36b}
    }
  </style>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.3"/>
    </filter>
  </defs>

  <g filter="url(#bleed)">
    <ellipse class="wash-sky" cx="210" cy="150" rx="195" ry="140"/>
    <circle class="wash-planet" cx="210" cy="228" r="96"/>
    <path class="wash-trunk" d="M120 168 Q112 146 124 120 Q132 104 142 120 Q154 146 146 170Z"/>
    <path class="wash-trunk" d="M194 140 Q184 108 200 78 Q212 62 222 80 Q236 110 226 142Z"/>
    <path class="wash-trunk" d="M276 168 Q268 148 280 126 Q288 114 296 128 Q306 150 300 170Z"/>
    <ellipse class="wash-crown" cx="132" cy="102" rx="30" ry="14"/>
    <ellipse class="wash-crown" cx="210" cy="58" rx="44" ry="18"/>
    <ellipse class="wash-crown" cx="290" cy="108" rx="28" ry="13"/>
  </g>

  <g class="ink" filter="url(#wobble)">
    <path d="M114 228 A96 96 0 0 1 306 228 A96 96 0 0 1 114 228"/>
    <path class="thin" d="M130 280 q40 36 96 40"/>
    <path class="thin" d="M146 262 q12 -7 24 0 q-12 8 -24 0Z M246 292 q7 -4 14 0 q-7 5 -14 0Z M272 246 q5 -3 10 0 q-5 4 -10 0Z"/>
    <!-- 左树 -->
    <path d="M120 168 Q112 146 124 120 L126 108 M142 120 Q154 146 146 170 M136 116 L138 104"/>
    <path class="thin" d="M126 110 Q114 100 104 102 M126 108 Q128 96 120 90 M138 106 Q146 94 156 96 M138 104 Q142 98 150 104"/>
    <!-- 中树 -->
    <path d="M194 140 Q184 108 200 78 L202 66 M222 80 Q236 110 226 142 M212 74 L214 60"/>
    <path class="thin" d="M202 68 Q186 54 170 58 M202 66 Q200 50 190 44 M214 62 Q222 44 236 42 M214 60 Q232 56 250 64 M208 70 Q210 56 206 46"/>
    <path class="thin" d="M204 110 q4 8 2 18 M216 100 q-2 10 2 18"/>
    <!-- 右树 -->
    <path d="M276 168 Q268 148 280 126 L282 116 M296 128 Q306 150 300 170 M290 120 L292 110"/>
    <path class="thin" d="M282 116 Q272 106 262 110 M282 114 Q284 102 278 96 M292 112 Q300 100 312 104 M292 110 Q304 112 314 118"/>
  </g>

  <g class="star">
    <path d="M60 60 l3 -10 l3 10 l10 3 l-10 3 l-3 10 l-3 -10 l-10 -3Z"/>
    <path d="M360 50 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2Z"/>
    <circle cx="372" cy="170" r="2"/>
    <circle cx="40" cy="160" r="1.8"/>
    <circle cx="310" cy="24" r="1.6"/>
    <circle cx="110" cy="30" r="1.6"/>
  </g>
</svg>
