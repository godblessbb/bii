<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="一颗小行星上长着一枝玫瑰，旁边有一座小火山，天上挂着弯月">
  <!-- 原创手绘感插画：datode.com 微博存档设计稿。线条与配色均为本页自绘。 -->
  <style>
    .ink{fill:none;stroke:#3a3029;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke-width:1.4}
    .wash-sky{fill:#9db7d3;opacity:.38}
    .wash-planet{fill:#e6c98f;opacity:.7}
    .wash-shade{fill:#c39a63;opacity:.35}
    .wash-rose{fill:#cf5b4f;opacity:.78}
    .wash-leaf{fill:#7fa36a;opacity:.7}
    .wash-moon{fill:#f0cf73;opacity:.8}
    .wash-smoke{fill:#b7b2ac;opacity:.35}
    .star{fill:#e2ab3c}
    @media (prefers-color-scheme: dark){
      .ink{stroke:#efe4cc}
      .wash-sky{fill:#3d5a8a;opacity:.45}
      .wash-planet{fill:#c9a86c;opacity:.55}
      .wash-shade{fill:#7c5c38;opacity:.45}
      .wash-rose{fill:#e2675a;opacity:.85}
      .wash-leaf{fill:#86b072;opacity:.6}
      .wash-moon{fill:#ffdc7a;opacity:.9}
      .star{fill:#ffd36b}
    }
  </style>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bleed" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- 水彩底色 -->
  <g filter="url(#bleed)">
    <ellipse class="wash-sky" cx="240" cy="170" rx="210" ry="150"/>
    <circle class="wash-planet" cx="236" cy="262" r="84"/>
    <path class="wash-shade" d="M168 300 Q236 352 306 296 Q296 330 236 344 Q186 340 168 300Z"/>
    <path class="wash-moon" d="M392 46 A34 34 0 1 0 412 104 A26 26 0 1 1 392 46Z"/>
    <path class="wash-rose" d="M222 98 Q226 72 246 70 Q268 72 268 96 Q262 116 246 118 Q226 116 222 98Z"/>
    <path class="wash-leaf" d="M246 150 Q270 134 286 142 Q272 160 248 158Z M242 164 Q216 150 202 160 Q218 176 240 172Z"/>
    <path class="wash-smoke" d="M150 186 Q140 160 156 146 Q170 134 160 114 Q182 130 172 152 Q164 170 170 188Z"/>
  </g>

  <!-- 墨线 -->
  <g class="ink" filter="url(#wobble)">
    <!-- 星球 -->
    <path d="M152 262 A84 84 0 0 1 320 260 A84 84 0 0 1 152 262"/>
    <path class="thin" d="M186 296 q10 -6 20 0 q-10 7 -20 0Z"/>
    <path class="thin" d="M262 312 q8 -5 16 0 q-8 6 -16 0Z"/>
    <path class="thin" d="M284 232 q6 -4 12 0 q-6 5 -12 0Z"/>
    <path class="thin" d="M168 312 q30 22 70 26"/>
    <!-- 小火山 -->
    <path d="M150 214 L160 190 L178 192 L190 218"/>
    <path class="thin" d="M160 190 q9 -5 18 2"/>
    <path class="thin" d="M168 186 q-8 -14 4 -24 q10 -9 2 -22"/>
    <!-- 玫瑰：茎、叶、刺、花 -->
    <path d="M238 180 C240 160 244 140 244 118"/>
    <path class="thin" d="M242 150 l6 -3 M240 164 l-6 -2 M243 132 l5 -2"/>
    <path d="M246 150 Q270 134 286 142 Q272 160 248 158"/>
    <path class="thin" d="M250 152 Q266 146 280 143"/>
    <path d="M241 166 Q216 150 202 160 Q218 176 240 172"/>
    <path class="thin" d="M236 167 Q220 162 208 161"/>
    <path d="M224 100 Q222 120 244 120 Q266 118 266 98"/>
    <path d="M224 100 Q232 92 238 98 Q234 82 246 78 Q258 82 254 98 Q260 90 266 98"/>
    <path class="thin" d="M232 96 Q236 76 248 72 Q262 74 260 94"/>
    <path class="thin" d="M240 98 Q244 88 252 92"/>
    <!-- 弯月 -->
    <path d="M392 46 A34 34 0 1 0 412 104 A26 26 0 1 1 392 46Z"/>
  </g>

  <!-- 星星（四角闪光） -->
  <g class="star">
    <path d="M86 70 l3 -11 l3 11 l11 3 l-11 3 l-3 11 l-3 -11 l-11 -3Z"/>
    <path d="M330 120 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2Z"/>
    <path d="M58 200 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"/>
    <path d="M402 214 l2 -8 l2 8 l8 2 l-8 2 l-2 8 l-2 -8 l-8 -2Z"/>
    <circle cx="146" cy="44" r="2.4"/>
    <circle cx="300" cy="40" r="2"/>
    <circle cx="440" cy="160" r="2.2"/>
    <circle cx="36" cy="128" r="1.8"/>
    <circle cx="190" cy="66" r="1.6"/>
  </g>
</svg>
