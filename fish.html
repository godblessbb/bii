<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y5CXD1W4K6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y5CXD1W4K6');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>改进的动态鱼缸模拟</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
        }
        #aquarium {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="aquarium"></canvas>
    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 鱼类
        class Fish {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speed = Math.random() * 1 + 0.5;
                this.direction = Math.random() < 0.5 ? -1 : 1; // -1 for left, 1 for right
                this.verticalSpeed = 0;
                this.tailAngle = 0;
                this.tailSpeed = 0.1;
            }

            update() {
                this.x += this.speed * this.direction;
                this.verticalSpeed += (Math.random() - 0.5) * 0.1;
                this.verticalSpeed *= 0.95; // Damping
                this.y += this.verticalSpeed;

                // Boundary check
                if (this.x < 0 || this.x > canvas.width) {
                    this.direction *= -1;
                }
                if (this.y < 50 || this.y > canvas.height - 50) {
                    this.verticalSpeed *= -1;
                }

                // Tail animation
                this.tailAngle += this.tailSpeed;
                if (Math.abs(this.tailAngle) > 0.3) {
                    this.tailSpeed *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.direction, 1);

                // Fish body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(20, -10, 40, 0);
                ctx.quadraticCurveTo(20, 10, 0, 0);
                ctx.fill();

                // Tail
                ctx.save();
                ctx.translate(-5, 0);
                ctx.rotate(this.tailAngle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-15, -10);
                ctx.lineTo(-15, 10);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // Fin
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.quadraticCurveTo(15, -15, 25, -10);
                ctx.quadraticCurveTo(25, -5, 20, 0);
                ctx.fill();

                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(30, -3, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(31, -3, 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 海龟类
        class Turtle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = Math.random() * 0.5 + 0.2;
                this.direction = Math.random() < 0.5 ? -1 : 1; // -1 for left, 1 for right
                this.verticalSpeed = 0;
                this.legAngle = 0;
                this.legSpeed = 0.05;
            }

            update() {
                this.x += this.speed * this.direction;
                this.verticalSpeed += (Math.random() - 0.5) * 0.05;
                this.verticalSpeed *= 0.95; // Damping
                this.y += this.verticalSpeed;

                // Boundary check
                if (this.x < 0 || this.x > canvas.width) {
                    this.direction *= -1;
                }
                if (this.y < 50 || this.y > canvas.height - 50) {
                    this.verticalSpeed *= -1;
                }

                // Leg animation
                this.legAngle += this.legSpeed;
                if (Math.abs(this.legAngle) > 0.2) {
                    this.legSpeed *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.direction, 1);

                // Shell
                ctx.fillStyle = 'green';
                ctx.beginPath();
                ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'darkgreen';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-25, 0);
                ctx.lineTo(25, 0);
                ctx.moveTo(0, -15);
                ctx.lineTo(0, 15);
                ctx.stroke();

                // Head
                ctx.fillStyle = 'olive';
                ctx.beginPath();
                ctx.ellipse(35, 0, 10, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eye
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(40, -3, 2, 0, Math.PI * 2);
                ctx.fill();

                // Legs
                ctx.save();
                ctx.translate(10, 15);
                ctx.rotate(this.legAngle);
                this.drawLeg();
                ctx.restore();

                ctx.save();
                ctx.translate(-10, 15);
                ctx.rotate(-this.legAngle);
                this.drawLeg();
                ctx.restore();

                ctx.save();
                ctx.translate(10, -15);
                ctx.rotate(-this.legAngle);
                this.drawLeg();
                ctx.restore();

                ctx.save();
                ctx.translate(-10, -15);
                ctx.rotate(this.legAngle);
                this.drawLeg();
                ctx.restore();

                ctx.restore();
            }

            drawLeg() {
                ctx.fillStyle = 'olive';
                ctx.beginPath();
                ctx.ellipse(0, 0, 5, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 水草类
        class Seaweed {
            constructor(x, baseY, height) {
                this.x = x;
                this.baseY = baseY;
                this.height = height;
                this.segments = 10;
                this.waveSpeed = Math.random() * 0.02 + 0.01;
                this.waveOffset = Math.random() * Math.PI * 2;
            }

            draw() {
                ctx.strokeStyle = 'darkgreen';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.baseY);
                for (let i = 1; i <= this.segments; i++) {
                    const t = i / this.segments;
                    const y = this.baseY - t * this.height;
                    const waveAmount = 20 * (1 - t); // Wave decreases towards the top
                    const xOffset = Math.sin(Date.now() * this.waveSpeed + this.waveOffset + i * 0.5) * waveAmount;
                    ctx.lineTo(this.x + xOffset, y);
                }
                ctx.stroke();
            }
        }

        // 创建对象
        const fishes = Array(10).fill().map(() => new Fish(Math.random() * canvas.width, Math.random() * canvas.height, `hsl(${Math.random() * 360}, 100%, 50%)`));
        const turtles = Array(2).fill().map(() => new Turtle(Math.random() * canvas.width, Math.random() * canvas.height));
        const seaweeds = Array(8).fill().map(() => new Seaweed(Math.random() * canvas.width, canvas.height, Math.random() * 150 + 100));

        // 绘制假山
        function drawRock() {
            ctx.fillStyle = 'grey';
            ctx.beginPath();
            ctx.moveTo(100, canvas.height);
            ctx.quadraticCurveTo(150, canvas.height - 100, 200, canvas.height - 50);
            ctx.quadraticCurveTo(250, canvas.height - 150, 300, canvas.height);
            ctx.fill();

            // Add some details to the rock
            ctx.strokeStyle = 'darkgrey';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(150, canvas.height - 80);
            ctx.lineTo(180, canvas.height - 60);
            ctx.moveTo(200, canvas.height - 100);
            ctx.lineTo(220, canvas.height - 80);
            ctx.stroke();
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#4169E1');
            gradient.addColorStop(1, '#000080');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制对象
            seaweeds.forEach(seaweed => seaweed.draw());
            drawRock();
            fishes.forEach(fish => {
                fish.update();
                fish.draw();
            });
            turtles.forEach(turtle => {
                turtle.update();
                turtle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
