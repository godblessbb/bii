<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    width: 100%;
    background: #0a0a14;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
      #0a0a14;
    min-height: 100dvh;
    padding: 56px 20px 80px;
  }

  .wrap {
    max-width: 540px;
    margin: 0 auto;
  }

  .head {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .head .title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.4px;
    background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .head .sub {
    font-size: 13px;
    color: rgba(232, 232, 240, 0.55);
    letter-spacing: 0.4px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .song {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.05);
    text-decoration: none;
    color: inherit;
    transition: background 0.18s, border-color 0.18s, transform 0.1s;
    cursor: pointer;
  }
  .song:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.10);
  }
  .song:active { transform: scale(0.985); }

  .song .cover {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        #6366f1, #8b5cf6, #ec4899, #f59e0b, #6366f1);
    position: relative;
    box-shadow:
      0 6px 16px -4px rgba(99, 102, 241, 0.5),
      0 0 0 1px rgba(255,255,255,0.06);
  }
  .song .cover::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, #1a1a2e 0%, #0a0a14 100%);
  }
  .song .cover::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0a0a14;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.18);
  }

  .song .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .song .info .name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    /* Allow up to 2 lines so longer cover titles stay readable on mobile */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }
  .song .info .artist {
    font-size: 12px;
    color: rgba(232, 232, 240, 0.5);
    letter-spacing: 0.4px;
  }

  .song .play-mark {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
    color: rgba(232, 232, 240, 0.85);
    transition: background 0.18s, color 0.18s, transform 0.18s;
  }
  .song:hover .play-mark {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    transform: scale(1.06);
  }
  .song .play-mark svg { width: 14px; height: 14px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: rgba(232, 232, 240, 0.4);
    font-size: 14px;
  }

  .footer {
    margin-top: 48px;
    text-align: center;
    font-size: 11px;
    color: rgba(232, 232, 240, 0.3);
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    body { padding: 40px 16px 60px; }
    .head .title { font-size: 26px; }
    .song { padding: 12px 14px; gap: 12px; }
    .song .cover { width: 48px; height: 48px; }
    .song .play-mark { width: 32px; height: 32px; }
  }

<body>
  <div class="wrap">
    <div class="head">
      <div class="title">Rapstar</div>
      <div class="sub">04bot · Personal Mix</div>
    </div>
    <div class="list" id="list"></div>
    <div class="footer">© 04bot · Made with care</div>
  </div>

<script>
  // Manifest-driven — do NOT hand-edit. Re-generate via scripts/rapstar_publish.py regen

  const list = document.getElementById('list');

      <a class="song" href="${t.url}" data-id="${t.id}" onclick="gtag('event','song_open',{event_category:'rapstar',song_slug:'${t.id}',song_title:'${(t.name||'').replace(/'/g,"\\'")}'})">

        <div class="info">
          <div class="name">${t.name}</div>
          <div class="artist">${t.artist}</div>
        </div>
        <div class="play-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </a>
    `).join('');
  }
</script>
