<script>
(function() {
  const SONG_SLUG = "payphone-cover";
  const SONG_TITLE = "Payphone (Wiz Khalifa Verse Cover)";
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const rewindBtn = document.getElementById('rewindBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const cover = document.getElementById('cover');
  const pulse = document.getElementById('pulse');
  const loading = document.getElementById('loading');
  const waveform = document.getElementById('waveform');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');

  const PLAY_PATH = 'M8 5v14l11-7z';
  const PAUSE_PATH = 'M6 4h4v16H6zm8 0h4v16h-4z';

  // ---- GA event helpers ----
  // Track key engagement: first-play / 25% / 50% / 75% / complete / seek / rewind / forward
  const gaEvent = (name, params) => {
    try {
      if (typeof gtag === 'function') {
        gtag('event', name, Object.assign({
          song_slug: SONG_SLUG,
          song_title: SONG_TITLE
        }, params || {}));
      }
    } catch (e) { /* never break playback for analytics */ }
  };
  let firstPlayFired = false;
  let progressMarks = { q1: false, q2: false, q3: false };

  // ---- Build waveform bars ----
  const BAR_COUNT = 48;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    waveform.appendChild(b);
    bars.push(b);
  }

  // ---- Format time ----
  function fmtTime(sec) {
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  // ---- Web Audio + Analyser ----
  let audioCtx = null;
  let analyser = null;
  let sourceNode = null;
  let dataArray = null;
  let animFrame = null;

  function setupAudioContext() {
    if (audioCtx) return true;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      audioCtx = new Ctx();
      sourceNode = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.75;
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      return true;
    } catch (e) {
      console.warn('AudioContext setup failed:', e);
      return false;
    }
  }

  // ---- Animate waveform ----
  function renderWave() {
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    const step = Math.floor(dataArray.length / BAR_COUNT) || 1;
    for (let i = 0; i < BAR_COUNT; i++) {
      let v = 0;
      let count = 0;
      for (let j = 0; j < step; j++) {
        const idx = i * step + j;
        if (idx < dataArray.length) {
          v += dataArray[idx];
          count++;
        }
      }
      v = count ? v / count : 0;
      const norm = Math.max(0, Math.min(1, v / 220));
      const h = 8 + norm * 92;
      bars[i].style.height = h + '%';
    }
    animFrame = requestAnimationFrame(renderWave);
  }

  function startWave() {
    if (animFrame) cancelAnimationFrame(animFrame);
    renderWave();
  }
  function stopWave() {
    if (animFrame) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    }
    bars.forEach((b, i) => {
      const h = 8 + Math.sin(i * 0.4) * 4 + 4;
      b.style.height = h + '%';
    });
  }

  // ---- Idle ambient animation when paused ----
  let idleFrame = null;
  let idleStart = 0;
  function idleLoop(t) {
    if (!idleStart) idleStart = t;
    const dt = (t - idleStart) / 1000;
    bars.forEach((b, i) => {
      const phase = i * 0.35;
      const h = 8 + (Math.sin(dt * 1.4 + phase) + 1) * 6;
      b.style.height = h + '%';
    });
    idleFrame = requestAnimationFrame(idleLoop);
  }
  function startIdle() {
    if (idleFrame) cancelAnimationFrame(idleFrame);
    idleStart = 0;
    idleLoop(performance.now());
  }
  function stopIdle() {
    if (idleFrame) {
      cancelAnimationFrame(idleFrame);
      idleFrame = null;
    }
  }

  // ---- Play / Pause ----
  async function togglePlay() {
    if (audio.paused) {
      const ok = setupAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch (e) {}
      }
      try {
        await audio.play();
      } catch (e) {
        console.warn('Play failed:', e);
        return;
      }
      playIcon.setAttribute('d', PAUSE_PATH);
      playBtn.setAttribute('aria-label', '暂停');
      cover.classList.add('playing');
      pulse.classList.add('active');
      stopIdle();
      if (ok) startWave();

      if (!firstPlayFired) {
        firstPlayFired = true;
        gaEvent('song_play', { event_category: 'rapstar', action: 'first_play' });
      } else {
        gaEvent('song_resume', { event_category: 'rapstar' });
      }
    } else {
      audio.pause();
      playIcon.setAttribute('d', PLAY_PATH);
      playBtn.setAttribute('aria-label', '播放');
      cover.classList.remove('playing');
      pulse.classList.remove('active');
      stopWave();
      startIdle();
      gaEvent('song_pause', {
        event_category: 'rapstar',
        position_sec: Math.floor(audio.currentTime || 0),
        position_pct: audio.duration ? Math.floor((audio.currentTime / audio.duration) * 100) : 0
      });
    }
  }

  playBtn.addEventListener('click', togglePlay);

  rewindBtn.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
    gaEvent('song_rewind', { event_category: 'rapstar' });
  });
  forwardBtn.addEventListener('click', () => {
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
    gaEvent('song_forward', { event_category: 'rapstar' });
  });

  // ---- Progress ----
  audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = fmtTime(audio.currentTime);

    // Engagement quartiles (each fires once)
    if (!progressMarks.q1 && pct >= 25) {
      progressMarks.q1 = true;
      gaEvent('song_progress', { event_category: 'rapstar', milestone: 25 });
    }
    if (!progressMarks.q2 && pct >= 50) {
      progressMarks.q2 = true;
      gaEvent('song_progress', { event_category: 'rapstar', milestone: 50 });
    }
    if (!progressMarks.q3 && pct >= 75) {
      progressMarks.q3 = true;
      gaEvent('song_progress', { event_category: 'rapstar', milestone: 75 });
    }
  });
  audio.addEventListener('ended', () => {
    playIcon.setAttribute('d', PLAY_PATH);
    cover.classList.remove('playing');
    pulse.classList.remove('active');
    stopWave();
    startIdle();
    audio.currentTime = 0;
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';
    gaEvent('song_complete', { event_category: 'rapstar' });
    // Reset for replay
    firstPlayFired = false;
    progressMarks = { q1: false, q2: false, q3: false };
  });
  audio.addEventListener('waiting', () => loading.classList.add('active'));
  audio.addEventListener('canplay', () => loading.classList.remove('active'));
  audio.addEventListener('playing', () => loading.classList.remove('active'));

  // ---- Click / drag progress ----
  function seekFromEvent(e) {
    const rect = progressBar.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    const pct = x / rect.width;
    if (audio.duration) {
      audio.currentTime = pct * audio.duration;
      progressFill.style.width = (pct * 100) + '%';
      gaEvent('song_seek', {
        event_category: 'rapstar',
        position_pct: Math.floor(pct * 100)
      });
    }
  }
  progressBar.addEventListener('click', seekFromEvent);
  progressBar.addEventListener('touchstart', (e) => {
    e.preventDefault();
    seekFromEvent(e);
  }, { passive: false });

  // ---- iOS unlock on first touch ----
  function unlockAudio() {
    if (!audioCtx) setupAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('click', unlockAudio);
  }
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  // Start idle animation
  startIdle();
})();
</script>
