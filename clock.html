<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y5CXD1W4K6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y5CXD1W4K6');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock with Date</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f0f0f0;
        }
        .clock-container {
            text-align: center;
        }
        .clock {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
        }
        .day {
            font-size: 1.5rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .date {
            font-size: 1.5rem;
            color: #555;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <svg class="clock" viewBox="0 0 100 100">
            <!-- Clock face -->
            <circle cx="50" cy="50" r="45" fill="#d2691e" />
            <circle cx="50" cy="50" r="40" fill="white" />
            
            <!-- Hour markers -->
            <line x1="50" y1="10" x2="50" y2="15" stroke="black" stroke-width="2" />
            <line x1="90" y1="50" x2="85" y2="50" stroke="black" stroke-width="2" />
            <line x1="50" y1="90" x2="50" y2="85" stroke="black" stroke-width="2" />
            <line x1="10" y1="50" x2="15" y2="50" stroke="black" stroke-width="2" />
            
            <!-- Minute markers -->
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(30 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(60 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(120 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(150 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(210 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(240 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(300 50 50)" />
            <line x1="50" y1="10" x2="50" y2="13" stroke="black" stroke-width="1" transform="rotate(330 50 50)" />
            
            <!-- Clock hands -->
            <line id="hour-hand" x1="50" y1="50" x2="50" y2="25" stroke="black" stroke-width="2" stroke-linecap="round" />
            <line id="minute-hand" x1="50" y1="50" x2="50" y2="20" stroke="black" stroke-width="1.5" stroke-linecap="round" />
            <line id="second-hand" x1="50" y1="50" x2="50" y2="15" stroke="red" stroke-width="1" stroke-linecap="round" />
            
            <!-- Center dot -->
            <circle cx="50" cy="50" r="1.5" fill="black" />
        </svg>
        <div class="day" id="day"></div>
        <div class="date" id="date"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours() % 12;

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = ((minutes + seconds / 60) / 60) * 360;
            const hourDegrees = ((hours + minutes / 60) / 12) * 360;

            document.getElementById('second-hand').setAttribute('transform', `rotate(${secondDegrees} 50 50)`);
            document.getElementById('minute-hand').setAttribute('transform', `rotate(${minuteDegrees} 50 50)`);
            document.getElementById('hour-hand').setAttribute('transform', `rotate(${hourDegrees} 50 50)`);

            document.getElementById('day').textContent = now.toLocaleString('en-US', { weekday: 'long' });
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        setInterval(updateClock, 1000);
        updateClock(); // Initial update
    </script>
</body>
</html>
