<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y5CXD1W4K6"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>沙漏计时器 · 香又脆的菜花</title>
    <meta name="description" content="一只会翻转的沙漏：选一段时长，专注到沙子漏完。">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#060807" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e7eae2" media="(prefers-color-scheme: light)">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
      // 语言尽早定下来，避免首屏闪一下中文再变英文
      (function () {
        var q = /[?&]lang=(zh|en)/i.exec(location.search), l = q && q[1].toLowerCase();
        if (!l) { try { l = localStorage.getItem('datode-lang'); } catch (e) {} }
        if (!l) l = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
        document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
      })();
    </script>
    <style>
      /* 沙漏 · 暗室里的一件器物
         和首页同一套色：近黑苔藓底 + 菜花绿；沙子是菜花的花粉黄，在暗处自己发一点光。
         亮色：灰绿粉笔底 + 叶绿墨，沙子换成赭黄。 */
      :root {
        --bg: #060807;
        --bg-2: #0c110e;
        --ink: #e8efe4;
        --ink-2: #9aa79c;
        --ink-3: #5f6b62;
        --line: rgba(232, 239, 228, 0.13);
        --line-2: rgba(232, 239, 228, 0.28);
        --acc: #c4ff3a;
        --acc-ink: #0b1205;
        --acc-2: #ff6a3d;
        --sand-hi: #fff1a6;
        --sand: #f4c534;
        --sand-lo: #b9780f;
        --glow: rgba(244, 197, 52, 0.30);
        --glass: rgba(232, 239, 228, 0.55);
        --glass-fill: rgba(232, 239, 228, 0.035);
        --cap: #141a16;
        --cap-hi: rgba(232, 239, 228, 0.22);
        --rod: rgba(232, 239, 228, 0.32);
        --spot: rgba(196, 255, 58, 0.07);

        --f-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
        --f-num: "SF Pro Display", "Inter Display", "Helvetica Neue", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
        --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --gut: clamp(16px, 4vw, 64px);
        --ease: cubic-bezier(.2, .8, .2, 1);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e7eae2;
          --bg-2: #f3f5ef;
          --ink: #0e1a12;
          --ink-2: #48574c;
          --ink-3: #7d887f;
          --line: rgba(14, 26, 18, 0.14);
          --line-2: rgba(14, 26, 18, 0.32);
          --acc: #1f6b14;
          --acc-ink: #f3f8ea;
          --acc-2: #ff5418;
          --sand-hi: #f7cf5a;
          --sand: #dc9a17;
          --sand-lo: #9a5a06;
          --glow: rgba(220, 154, 23, 0);
          --glass: rgba(14, 26, 18, 0.6);
          --glass-fill: rgba(255, 255, 255, 0.35);
          --cap: #0e1a12;
          --cap-hi: rgba(255, 255, 255, 0.25);
          --rod: rgba(14, 26, 18, 0.45);
          --spot: rgba(255, 255, 255, 0.55);
          color-scheme: light;
        }
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; background: var(--bg); }
      body {
        margin: 0; min-height: 100vh; min-height: 100svh;
        background:
          radial-gradient(60% 70% at 30% 50%, var(--spot), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: var(--f-sans);
        font-size: 16px; line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        transition: background-color .6s var(--ease);
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: inherit; }
      ::selection { background: var(--acc); color: var(--acc-ink); }
      :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      [hidden] { display: none !important; }

      .app { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }

      /* ---------- 顶栏 ---------- */
      .bar {
        display: flex; align-items: center; gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) var(--gut) 14px;
        position: relative; z-index: 3;
      }
      .back {
        display: inline-flex; align-items: center; gap: 10px;
        text-decoration: none; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
        min-width: 0;
      }
      .back span { overflow: hidden; text-overflow: ellipsis; }
      .orb {
        width: 18px; height: 18px; border-radius: 50%; flex: none;
        background: radial-gradient(circle at 35% 30%, #f4ffd6, var(--acc) 45%, color-mix(in srgb, var(--acc) 30%, var(--bg)) 100%);
        box-shadow: 0 0 16px color-mix(in srgb, var(--acc) 50%, transparent);
      }
      .bar-r { margin-left: auto; display: flex; gap: 8px; flex: none; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        height: 34px; padding: 0 12px; border-radius: 999px;
        background: transparent; border: 1px solid var(--line-2);
        font: 500 12px/1 var(--f-mono); letter-spacing: .04em; color: var(--ink-2);
        transition: color .2s, border-color .2s, background-color .2s;
      }
      .pill:hover { color: var(--ink); border-color: var(--ink-2); }
      .pill svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .pill[aria-pressed="false"] .on, .pill[aria-pressed="true"] .off { display: none; }

      /* ---------- 主体 ---------- */
      .main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
        align-items: center;
        gap: clamp(16px, 3vw, 80px);
        padding: 0 var(--gut) clamp(16px, 3vh, 48px);
        width: 100%; max-width: 2200px; margin: 0 auto;
      }
      .stage {
        position: relative;
        height: min(calc(100svh - 120px), 1400px);
        min-height: 420px;
      }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .stage-hit {
        position: absolute; inset: 6% 18%; border: 0; background: transparent; border-radius: 40%;
        cursor: default;
      }
      .stage-hit[data-live="1"] { cursor: pointer; }

      .panel { position: relative; z-index: 2; max-width: 760px; min-width: 0; }
      .eyebrow {
        display: flex; align-items: center; gap: 12px; margin: 0 0 clamp(10px, 2vh, 28px);
        font: 500 clamp(11px, .75vw, 15px)/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
      }
      .eyebrow b { color: var(--acc); font-weight: 500; }
      .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      h1 {
        margin: 0; font-weight: 700; letter-spacing: .01em;
        font-size: clamp(18px, 1.5vw, 32px); line-height: 1.25;
      }
      h1 small { display: block; margin-top: 4px; font-weight: 400; font-size: .62em; color: var(--ink-2); letter-spacing: .02em; }

      .readout {
        margin: clamp(10px, 2.4vh, 36px) 0 0;
        font-family: var(--f-num);
        font-weight: 200;
        font-size: clamp(76px, 10.2vw, 260px);
        line-height: .86;
        letter-spacing: -.045em;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1, "ss01" 1;
        white-space: nowrap;
        transition: color .5s var(--ease);
      }
      .readout.is-long { font-size: clamp(60px, 7.6vw, 200px); }
      .readout .sep { opacity: .55; margin: 0 .01em; }
      [data-status="paused"] .readout { color: var(--ink-2); }
      [data-status="paused"] .readout .sep { animation: blink 1.2s steps(2, jump-none) infinite; }
      [data-status="done"] .readout { color: var(--acc); }
      .readout .msg { font-family: var(--f-sans); font-weight: 900; letter-spacing: -.02em; font-size: .62em; line-height: 1.1; }
      @keyframes blink { 50% { opacity: .12; } }

      .meta {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
        margin: clamp(12px, 2vh, 26px) 0 0;
        font: 500 clamp(12px, .8vw, 16px)/1.4 var(--f-mono); color: var(--ink-2); letter-spacing: .04em;
      }
      .meta .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 8px; vertical-align: 1px; }
      [data-status="running"] .meta .dot { background: var(--acc); box-shadow: 0 0 10px var(--acc); }
      [data-status="paused"] .meta .dot { background: var(--acc-2); }
      [data-status="done"] .meta .dot { background: var(--acc); }
      .meta .ends { color: var(--ink-3); }

      .track { position: relative; height: 2px; margin: clamp(16px, 2.6vh, 36px) 0 0; background: var(--line); overflow: hidden; }
      .track i { position: absolute; inset: 0; background: var(--acc); transform-origin: left; transform: scaleX(0); }

      .label {
        margin: clamp(18px, 3.2vh, 44px) 0 10px;
        font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
      }
      .chips { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
      .chip {
        position: relative; height: clamp(44px, 3.4vw, 64px); border-radius: 12px;
        border: 1px solid var(--line-2); background: transparent;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        font: 400 clamp(17px, 1.15vw, 24px)/1 var(--f-num); font-variant-numeric: tabular-nums;
        transition: background-color .2s, color .2s, border-color .2s, opacity .2s;
        min-width: 0;
      }
      .chip small { font: 500 9px/1 var(--f-mono); letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
      .chip:hover { border-color: var(--ink-2); }
      .chip[aria-checked="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .chip[aria-checked="true"] small { color: color-mix(in srgb, var(--bg) 60%, var(--ink)); }
      .chip.custom { font-size: clamp(13px, .9vw, 17px); font-family: var(--f-sans); }
      .chip .cv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 4px; }
      .chips[aria-disabled="true"] .chip { opacity: .35; cursor: not-allowed; }

      .custom-form { display: flex; gap: 6px; margin-top: 8px; }
      .custom-form input {
        flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 12px;
        background: var(--bg-2); border: 1px solid var(--line-2);
        font: 400 18px/1 var(--f-num); font-variant-numeric: tabular-nums;
      }
      .custom-form input:focus { outline: none; border-color: var(--acc); }
      .custom-form .hint { display: block; margin-top: 6px; font: 500 11px/1.4 var(--f-mono); color: var(--ink-3); }
      .custom-wrap.bad input { border-color: var(--acc-2); }

      .ctrls { display: flex; gap: 8px; margin-top: clamp(16px, 2.6vh, 34px); }
      .btn {
        height: clamp(52px, 3.8vw, 70px); padding: 0 22px; border-radius: 999px;
        border: 1px solid var(--line-2); background: transparent;
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        font-weight: 700; font-size: clamp(15px, .95vw, 19px); letter-spacing: .02em;
        transition: transform .15s var(--ease), background-color .2s, color .2s, border-color .2s;
      }
      .btn:hover { border-color: var(--ink-2); }
      .btn:active { transform: scale(.97); }
      .btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
      .btn.primary { flex: 1; background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
      .btn.primary:hover { filter: brightness(1.06); }
      .btn.ghost { flex: none; }
      .btn.ghost svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .btn kbd { font: 500 10px/1 var(--f-mono); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .5; }
      .btn.ghost .t { display: inline; }

      .keys {
        margin: clamp(14px, 2.4vh, 30px) 0 0; display: flex; flex-wrap: wrap; gap: 6px 16px;
        font: 500 11px/1.4 var(--f-mono); color: var(--ink-3); letter-spacing: .04em;
      }
      .keys kbd { font: inherit; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
      .toast { font: 500 11px/1.4 var(--f-mono); color: var(--acc); min-height: 1.4em; margin: 8px 0 0; }

      /* ---------- 结束 ---------- */
      .done {
        position: absolute; left: 50%; bottom: 4%; transform: translate(-50%, 12px);
        width: min(92%, 440px);
        padding: 16px 16px 16px 20px; border-radius: 20px;
        display: flex; align-items: center; gap: 14px;
        background: color-mix(in srgb, var(--bg) 78%, transparent);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        border: 1px solid color-mix(in srgb, var(--acc) 55%, transparent);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--acc) 12%, transparent), 0 20px 60px -20px color-mix(in srgb, var(--acc) 45%, transparent);
        opacity: 0; pointer-events: none;
        transition: opacity .45s var(--ease), transform .45s var(--ease);
        z-index: 2;
      }
      [data-status="done"] .done { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      .done .txt { flex: 1; min-width: 0; }
      .done strong { display: block; font-size: 18px; line-height: 1.2; color: var(--acc); }
      .done .txt span { display: block; margin-top: 3px; font: 500 12px/1.4 var(--f-mono); color: var(--ink-2); }
      .done .btn { height: 46px; padding: 0 16px; font-size: 14px; flex: none; }

      /* 结束时整页亮一下，然后保持一圈淡淡的菜花绿 */
      .flash { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0;
        background: radial-gradient(70% 70% at 30% 50%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 70%);
        transition: opacity 1.2s var(--ease);
      }
      [data-status="done"] .flash { opacity: 1; animation: flash 2.4s var(--ease) 3; }
      @keyframes flash { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

      /* ---------- 手机 / 窄屏 ---------- */
      @media (max-width: 860px) {
        .main { grid-template-columns: minmax(0, 1fr); align-items: start; gap: 0; }
        .stage { height: min(46svh, 540px); min-height: 300px; }
        .panel { max-width: none; }
        .eyebrow { margin-top: 4px; }
        .readout { font-size: min(26vw, 150px); }
        .readout.is-long { font-size: min(19vw, 120px); }
        .keys { display: none; }
        .btn kbd { display: none; }
        /* 手机上读数已经是大字「时间到」、主按钮变成「再来一轮」，浮卡会挡住漏满的下半，收起来 */
        .done { display: none; }
      }
      @media (max-width: 420px) {
        .back .crumb { display: none; }
        .chips { gap: 5px; }
        .chip { border-radius: 10px; }
        .btn.ghost { padding: 0 16px; }
        .btn.ghost .t { display: none; }
      }
      @media (min-width: 861px) and (max-height: 640px) {
        .stage { min-height: 360px; }
      }
      @media (hover: none) { .keys { display: none; } .btn kbd { display: none; } }

      /* 减少动态效果：沙子不流、不翻转、不闪，计时照常 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      }
    </style>
</head>
<body>
  <div class="app" id="app" data-status="idle">
    <div class="flash" aria-hidden="true"></div>

    <header class="bar">
      <a class="back" href="./" data-i18n-title="home">
        <i class="orb" aria-hidden="true"></i><span><span class="full" data-i18n="brand">香又脆的菜花</span><span class="crumb" data-i18n="toolsCrumb"> / 工具</span></span>
      </a>
      <div class="bar-r">
        <button class="pill" id="soundBtn" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          <span data-i18n="sound">声音</span>
        </button>
        <button class="pill" id="langBtn" type="button" lang="en">EN</button>
      </div>
    </header>

    <main class="main">
      <section class="stage" id="stage">
        <canvas id="glass" aria-hidden="true"></canvas>
        <button class="stage-hit" id="stageHit" type="button" tabindex="-1" aria-hidden="true"></button>
        <div class="done" id="doneCard" role="status">
          <div class="txt">
            <strong data-i18n="doneTitle">时间到</strong>
            <span id="doneSub"></span>
          </div>
          <button class="btn primary" id="flipBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v2.2c0 2.6-2.2 4.6-4.3 6.8 2.1 2.2 4.3 4.2 4.3 6.8V21H6v-2.2c0-2.6 2.2-4.6 4.3-6.8C8.2 9.8 6 7.8 6 5.2z"/></svg>
            <span data-i18n="flip">翻转，再来一轮</span>
          </button>
        </div>
      </section>

      <section class="panel" aria-labelledby="ttl">
        <p class="eyebrow"><span><b>No.05</b> — <span data-i18n="eyebrow">工具 · 沙漏</span></span></p>
        <h1 id="ttl"><span data-i18n="title">沙漏计时器</span><small data-i18n="subtitle">选一段时长，专注到沙子漏完。</small></h1>

        <div class="readout" id="readout" role="timer" aria-atomic="true">25:00</div>
        <div class="meta">
          <span><i class="dot" aria-hidden="true"></i><span id="statusText">准备好了</span></span>
          <span class="ends" id="endsText"></span>
        </div>
        <div class="track" aria-hidden="true"><i id="trackFill"></i></div>

        <p class="label" id="durLabel" data-i18n="duration">时长 · 分钟</p>
        <div class="chips" id="chips" role="radiogroup" aria-labelledby="durLabel">
          <button class="chip" type="button" role="radio" data-min="5" aria-checked="false">5</button>
          <button class="chip" type="button" role="radio" data-min="15" aria-checked="false">15</button>
          <button class="chip" type="button" role="radio" data-min="25" aria-checked="true">25</button>
          <button class="chip" type="button" role="radio" data-min="45" aria-checked="false">45</button>
          <button class="chip" type="button" role="radio" data-min="60" aria-checked="false">60</button>
          <button class="chip custom" type="button" role="radio" id="customChip" aria-checked="false" aria-controls="customForm"><span class="cv" data-i18n="custom">自定义</span></button>
        </div>
        <form class="custom-form" id="customForm" hidden autocomplete="off">
          <div class="custom-wrap" id="customWrap" style="flex:1;min-width:0">
            <label class="sr" for="customIn" data-i18n="customLabel">自定义时长</label>
            <input id="customIn" type="text" inputmode="decimal" enterkeyhint="done" spellcheck="false" placeholder="40 · 12:30 · 1:30:00" aria-describedby="customHint" style="width:100%">
            <span class="hint" id="customHint" data-i18n="customHint">输入分钟数，或 mm:ss / h:mm:ss</span>
          </div>
          <button class="btn ghost" type="submit" style="height:46px" data-i18n="set">设定</button>
        </form>

        <div class="ctrls">
          <button class="btn primary" id="primaryBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" id="primaryIcon"><path d="M7 4.5v15l12-7.5z"/></svg>
            <span id="primaryText">开始</span><kbd>Space</kbd>
          </button>
          <button class="btn ghost" id="resetBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
            <span class="t" data-i18n="reset">重置</span><span class="sr" data-i18n="reset">重置</span>
          </button>
          <button class="btn ghost" id="shareBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3.6-3.6a4 4 0 0 0-5.7-5.7L12.5 5.8"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.6 3.6a4 4 0 0 0 5.7 5.7l1.1-1.1"/></svg>
            <span class="t" data-i18n="share">链接</span><span class="sr" data-i18n="shareLong">复制带时长的链接</span>
          </button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>
        <p class="keys" id="keys">

        for (i = 0; i <= steps; i++) { tt = 1 - i / steps; y = -tt * G; ctx.lineTo(-prof(tt) * R + inset, y); }
        for (i = 0; i <= steps; i++) { tt = i / steps; y = tt * G; ctx.lineTo(-prof(tt) * R + inset, y); }
        for (i = 0; i <= steps; i++) { tt = 1 - i / steps; y = tt * G; ctx.lineTo(prof(tt) * R - inset, y); }
        for (i = 0; i <= steps; i++) { tt = i / steps; y = -tt * G; ctx.lineTo(prof(tt) * R - inset, y); }
        ctx.closePath();
      }

      // 沙子的发光（暗色）：随下面的沙子变多而变亮
      if (C.dark) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var gl = ctx.createRadialGradient(0, G * 0.75, 0, 0, G * 0.75, Math.min(R * 1.6, W / 2, H / 2));
        var ga = 0.18 + 0.5 * fBot;
        gl.addColorStop(0, withA(C.sand, 0.22 * ga));
        gl.addColorStop(1, withA(C.sand, 0));
        ctx.fillStyle = gl; ctx.fillRect(-W, -H, W * 2, H * 2);
        var gt = ctx.createRadialGradient(0, -G * 0.55, 0, 0, -G * 0.55, Math.min(R * 1.3, W / 2));
        gt.addColorStop(0, withA(C.sand, 0.12 * fTop));
        gt.addColorStop(1, withA(C.sand, 0));
        ctx.fillStyle = gt; ctx.fillRect(-W, -H, W * 2, H * 2);
        ctx.restore();
      }

      // 立柱
      var rodX = R + 34 * u;
      [-1, 1].forEach(function (s) {
        var rg = ctx.createLinearGradient(s * rodX - 5 * u, 0, s * rodX + 5 * u, 0);
        rg.addColorStop(0, withA(C.rod, 0.15)); rg.addColorStop(0.45, C.rod); rg.addColorStop(1, withA(C.rod, 0.1));
        ctx.fillStyle = rg;
        roundRect(s * rodX - 4 * u, -G - 2, 8 * u, 2 * G + 4, 4 * u); ctx.fill();
      });

      // 玻璃内的淡底
      glassPath(0);
      ctx.fillStyle = C['glass-fill']; ctx.fill();

      // 沙子（裁在玻璃内）
      ctx.save();
      glassPath(2.2 * u);
      ctx.clip();
      var sandGrad = ctx.createLinearGradient(0, -G, 0, G);
      sandGrad.addColorStop(0, C['sand-lo']); sandGrad.addColorStop(0.18, C.sand); sandGrad.addColorStop(0.5, C['sand-hi']);
      sandGrad.addColorStop(0.82, C.sand); sandGrad.addColorStop(1, C['sand-lo']);

      // 上半：从瓶颈往上堆，中心有漏斗形的凹坑
      var topPeak = null, pileTop = G;
      if (fTop > 0.0005) {
        var drained = 1 - fTop, aTop = fTop * SAND, lv = levelFor(aTop), dip = 0, rr = 0;
        // 漏斗坑会挖掉一块面积：把液面抬高同样的面积，保证画出来的沙量 = 剩余比例
        for (var it = 0; it < 4; it++) {
          dip = Math.min(lv * G * 0.92, 70 * u * smooth(0, 0.06, drained)) * settle;
          rr = prof(lv) * R;
          lv = levelFor(Math.min(CHAMBER, aTop + (dip / G) * (rr / R) * 0.92 / 2.6));
        }
        var yS = -lv * G;
        ctx.beginPath();
        ctx.moveTo(-R * 1.2, 0);
        ctx.lineTo(-R * 1.2, yS);
        for (var i = 0; i <= 60; i++) {
          var x = -rr + (2 * rr) * i / 60, k = Math.max(0, 1 - Math.abs(x) / (rr * 0.92));
          ctx.lineTo(x, yS + dip * Math.pow(k, 1.6));
        }
        ctx.lineTo(R * 1.2, yS); ctx.lineTo(R * 1.2, 0);
        ctx.closePath();
        ctx.fillStyle = sandGrad; ctx.fill();
        if (grainPat) { ctx.fillStyle = grainPat; ctx.fill(); }
        // 表面一道亮边
        ctx.beginPath();
        for (i = 0; i <= 60; i++) {
          var x2 = -rr + (2 * rr) * i / 60, k2 = Math.max(0, 1 - Math.abs(x2) / (rr * 0.92));
          ctx.lineTo(x2, yS + dip * Math.pow(k2, 1.6));
        }
        ctx.strokeStyle = withA(C['sand-hi'], C.dark ? 0.9 : 0.7); ctx.lineWidth = 1.2 * u + 0.6; ctx.stroke();
      }

      // 下半：从端盖往上堆，中间一个锥形沙丘
      if (fBot > 0.0005) {
        var vb = fBot * SAND;
        var cone = 0.13 * smooth(0, 0.12, fBot) * settle;
        var d1 = levelFromCap(vb);
        for (var it2 = 0; it2 < 4; it2++) d1 = levelFromCap(Math.max(0, vb - cone * prof(1 - d1) * 0.98 / 2.25));
        var yB = G - d1 * G;
        var rb = prof(1 - d1) * R;
        var peakH = cone * G;
        ctx.beginPath();
        ctx.moveTo(-R * 1.2, G + 4);
        ctx.lineTo(-R * 1.2, yB);
        for (i = 0; i <= 60; i++) {
          var xb = -rb + 2 * rb * i / 60, kb = Math.max(0, 1 - Math.abs(xb) / (rb * 0.98));
          ctx.lineTo(xb, yB - peakH * Math.pow(kb, 1.25));
        }
        ctx.lineTo(R * 1.2, yB); ctx.lineTo(R * 1.2, G + 4);
        ctx.closePath();
        ctx.fillStyle = sandGrad; ctx.fill();
        if (grainPat) { ctx.fillStyle = grainPat; ctx.fill(); }
        ctx.beginPath();
        for (i = 0; i <= 60; i++) {
          var xb2 = -rb + 2 * rb * i / 60, kb2 = Math.max(0, 1 - Math.abs(xb2) / (rb * 0.98));
          ctx.lineTo(xb2, yB - peakH * Math.pow(kb2, 1.25));
        }
        ctx.strokeStyle = withA(C['sand-hi'], C.dark ? 0.9 : 0.7); ctx.lineWidth = 1.2 * u + 0.6; ctx.stroke();
        pileTop = yB - peakH;
      }

      // 沙流
      if (running && fp === null && fTop > 0.0005) {
        var sw = 3.2 * u + 0.6;
        var sg = ctx.createLinearGradient(0, 0, 0, pileTop);
        sg.addColorStop(0, C['sand-hi']); sg.addColorStop(1, withA(C.sand, 0.65));
        ctx.fillStyle = sg;
        var wob = reduced ? 0 : Math.sin(tNow / 90) * 0.25 * u;
        ctx.fillRect(-sw / 2 + wob, -4 * u, sw, pileTop + 4 * u);
        if (!reduced) {
          ctx.fillStyle = C['sand-hi'];
          var gScale = G;
          grains.forEach(function (g) {
            if (!g.hit) {
              g.vy += 2.6 * dt; g.y += g.vy * dt;
              var py = g.y * gScale * 0.35;
              if (py >= pileTop - 2 * u) {
                g.hit = true; g.y = (pileTop - 2 * u) / (gScale * 0.35);
                g.vx = (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.6);
                g.vy = -0.4 - Math.random() * 0.6;
              }
              ctx.globalAlpha = 0.9;
              ctx.fillRect(g.x * u * 6 - g.s * u, py, g.s * 2 * u + 0.5, g.s * 2 * u + 0.5);
            } else {
              g.x += g.vx * dt * 14; g.vy += 3.5 * dt; g.y += g.vy * dt * 0.25; g.life -= dt * 2.6;
              var hy = g.y * gScale * 0.35;
              if (g.life <= 0 || hy > pileTop + 30 * u) { spawn(g); return; }
              ctx.globalAlpha = Math.max(0, g.life);
              ctx.fillRect(g.x * u * 6 - g.s * u, hy, g.s * 2 * u + 0.5, g.s * 2 * u + 0.5);
            }
          });
          ctx.globalAlpha = 1;
        }
        // 瓶颈处的一点亮
        var ng = ctx.createRadialGradient(0, 0, 0, 0, 0, 18 * u);
        ng.addColorStop(0, withA(C['sand-hi'], 0.7)); ng.addColorStop(1, withA(C['sand-hi'], 0));
        ctx.fillStyle = ng; ctx.fillRect(-18 * u, -18 * u, 36 * u, 36 * u);
      }
      ctx.restore(); // 退出裁剪

      // 玻璃描边 + 高光
      glassPath(0);
      var gs = ctx.createLinearGradient(-R, 0, R, 0);
      gs.addColorStop(0, C.glass); gs.addColorStop(0.5, withA(C.glass, 0.35)); gs.addColorStop(1, C.glass);
      ctx.strokeStyle = gs; ctx.lineWidth = 1.6 * u + 0.5; ctx.stroke();
      glassPath(7 * u);
      ctx.strokeStyle = withA(C.glass, 0.12); ctx.lineWidth = 1 * u + 0.3; ctx.stroke();
      // 左侧竖向反光
      ctx.save();
      ctx.lineCap = 'round';
      [-1, 1].forEach(function (half) {
        ctx.beginPath();
        for (var i = 0; i <= 40; i++) {
          var tt = 0.3 + 0.55 * i / 40;
          ctx.lineTo(-prof(tt) * R * 0.78, half * tt * G);
        }
        ctx.strokeStyle = C.dark ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 9 * u; ctx.stroke();
        ctx.beginPath();
        for (i = 0; i <= 20; i++) {
          var t2 = 0.42 + 0.3 * i / 20;
          ctx.lineTo(prof(t2) * R * 0.86, half * t2 * G);
        }
        ctx.strokeStyle = C.dark ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 4 * u; ctx.stroke();
      });
      ctx.restore();

      // 端盖
      [-1, 1].forEach(function (s) {
        var y = s < 0 ? -G - capH : G;
        var cg = ctx.createLinearGradient(0, y, 0, y + capH);
        cg.addColorStop(0, C.cap); cg.addColorStop(1, C.cap);
        ctx.fillStyle = cg;
        roundRect(-capW, y, capW * 2, capH, capH * 0.35); ctx.fill();
        ctx.fillStyle = C['cap-hi'];
        ctx.fillRect(-capW + capH * 0.35, s < 0 ? y : y + 0.5, capW * 2 - capH * 0.7, 1);
        ctx.strokeStyle = C.line; ctx.lineWidth = 1;
        roundRect(-capW, y, capW * 2, capH, capH * 0.35); ctx.stroke();
      });
      // 端盖上的刻线（器物感）
      ctx.fillStyle = C.dark ? withA(C.acc, 0.85) : C.acc;
      ctx.fillRect(-capW + 22 * u, -G - capH / 2 - 1 * u, 26 * u, 2 * u);
      ctx.fillRect(capW - 48 * u, G + capH / 2 - 1 * u, 26 * u, 2 * u);

      ctx.restore(); // 退出旋转

      // 结束：一圈圈光环
      if (S.status === 'done') {
        var since = (tNow - doneAt) / 1000;
        if (reduced) {
          ringAt(cx, cy, R * 1.25, 0.5);
        } else {
          for (var r2 = 0; r2 < 2; r2++) {
            var ph = (since * 0.4 + r2 / 2) % 1;
            ringAt(cx, cy, R * (1.05 + ph * 0.5), Math.sin(ph * Math.PI) * 0.5 * (since < 10 ? 1 : 0.45));
          }
        }
      }
    }
    function ringAt(x, y, r, a) {
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 1.75, 0, 0, Math.PI * 2);
      ctx.strokeStyle = withA(C.acc, a); ctx.lineWidth = 1.5; ctx.stroke();
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function withA(col, a) {
      col = (col || '').trim();
      var m = /^#([0-9a-f]{6})$/i.exec(col);
      if (m) { var n = parseInt(m[1], 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
      m = /^rgba?\(([^,]+),([^,]+),([^,)]+)(?:,([^)]+))?\)$/.exec(col.replace(/\s/g, ''));
      if (m) return 'rgba(' + m[1] + ',' + m[2] + ',' + m[3] + ',' + (m[4] !== undefined ? +m[4] * a : a) + ')';
      return col;
    }

    // ======================= 帧循环 =======================
    // 只在需要动的时候跑 rAF；静止时画一帧就停。
    function needsLoop() {
      if (flipAnim) return true;
      if (S.status === 'running') return true;
      if (S.status === 'done' && !reduced) return true;
      return false;
    }
    function frame(ts) {
      rafId = 0;
      check();
      render(false);
      draw(now());
      if (needsLoop() && !document.hidden) {
        // 减少动态时运行中每秒画一次就够（沙面随时间变化，不需要 60fps）
        if (reduced && S.status === 'running' && !flipAnim) { clearTimeout(slowTimer); slowTimer = setTimeout(wake, 1000); }
        else rafId = requestAnimationFrame(frame);
      }
    }
    function wake() { if (!rafId) rafId = requestAnimationFrame(frame); }

    // 后台也要更新标题、到点也要结束（rAF 在后台不跑）
    setInterval(function () { check(); if (document.hidden) render(false); }, 1000);
    document.addEventListener('visibilitychange', function () { check(); render(true); });

    // ======================= 交互 =======================
    primaryBtn.addEventListener('click', toggle);
    resetBtn.addEventListener('click', reset);
    flipBtn.addEventListener('click', start);
    stageHit.addEventListener('click', function () { if (S.status === 'idle' || S.status === 'done') start(); });

    chips.addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b || S.status === 'running') return;
      if (b === customChip) { openCustom(); return; }
      customForm.hidden = true;
      setDuration(+b.getAttribute('data-min') * 60000);
    });
    chips.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var all = Array.prototype.slice.call(chips.querySelectorAll('.chip')), i = all.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length].focus();
    });
    function openCustom() {
      if (S.status === 'running') return;
      customForm.hidden = false;
      customIn.value = '';
      customIn.placeholder = human(S.durationMs).replace(' ' + t('minUnit'), '');
      customIn.focus();
    }
    customForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var ms = parseDur(customIn.value);
      if (!ms || ms < 1000) { customWrap.classList.add('bad'); say(t('badInput')); return; }
      customWrap.classList.remove('bad');
      customForm.hidden = true;
      setDuration(ms);
      primaryBtn.focus();
    });
    customIn.addEventListener('keydown', function (e) { if (e.key === 'Escape') { customForm.hidden = true; customChip.focus(); } });

    shareBtn.addEventListener('click', function () {
      var url = location.origin + location.pathname + '?d=' + Math.round(S.durationMs / 1000) + (lang === 'en' ? '&lang=en' : '');
      var ok = function () { say(t('copied') + url); }, bad = function () { say(t('copyFail') + url); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, bad); else bad();
    });

    soundBtn.addEventListener('click', function () {
      soundOn = !soundOn;
      soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
      soundBtn.setAttribute('aria-label', soundOn ? t('soundOn') : t('soundOff'));
      store('datode-hourglass-sound', soundOn ? 'on' : 'off');
      if (soundOn) unlockAudio();
    });
    langBtn.addEventListener('click', function () {
      lang = lang === 'en' ? 'zh' : 'en';
      store('datode-lang', lang);      // 和首页共用同一个语言偏好
      applyLang();
    });

    // 任何一次用户手势都顺手解锁声音
    ['pointerdown', 'keydown'].forEach(function (ev) { window.addEventListener(ev, unlockAudio, { capture: true, passive: true }); });

    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var onBtn = tag === 'BUTTON' || tag === 'A';
      var k = e.key;
      if (k === ' ' || k === 'Spacebar' || k === 'k' || k === 'K') {
        if (onBtn && k !== 'k' && k !== 'K' && e.target !== stageHit) return; // 让按钮自己处理空格
        e.preventDefault(); toggle();
      } else if (k === 'r' || k === 'R') { reset(); }
      else if (k === 'f' || k === 'F') { if (S.status === 'done') start(); }
      else if (k === 'c' || k === 'C') { e.preventDefault(); openCustom(); }
      else if (/^[1-5]$/.test(k) && S.status !== 'running') { customForm.hidden = true; setDuration(PRESETS[+k - 1] * 60000); }
    });

    function onScheme() { readColors(); draw(now()); }
    if (darkMQ.addEventListener) darkMQ.addEventListener('change', onScheme); else if (darkMQ.addListener) darkMQ.addListener(onScheme);
    function onReduce() { reduced = reduceMQ.matches; if (reduced) flipAnim = null; wake(); }
    if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', onReduce); else if (reduceMQ.addListener) reduceMQ.addListener(onReduce);

    if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
    else window.addEventListener('resize', resize);

    // ======================= 初始化 =======================
    var params = new URLSearchParams(location.search);
    var dq = params.get('d');
    var dSec = dq !== null ? parseFloat(dq) : NaN;
    if (isFinite(dSec) && dSec > 0) setDuration(dSec * 1000, 'url');
    else {
      var saved = +store('datode-hourglass-ms');
      if (saved >= 1000 && saved <= MAX_MS) setDuration(saved, 'url');
    }

    // 探针：读写的就是上面这一份 S，没有第二套状态
    window.__hourglass = {
      start: function () { start(); return this.state(); },
      pause: function () { pause(); return this.state(); },
      reset: function () { reset(); return this.state(); },
      state: function () {
        check();
        return { status: S.status, remainingMs: Math.round(remaining()), durationMs: S.durationMs };
      }
    };

    readColors();
    applyLang();
    resize();
    wake();
  })();
  </script>
</body>
</html>
